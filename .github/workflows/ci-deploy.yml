name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_tests:
        description: Run all browser regression suites before deployment
        type: boolean
        default: false
      local_release_sha:
        description: Exact main commit already checked and staged by deploy/local-release.sh
        type: string
      local_release_checksum:
        description: SHA-256 of the locally checked release archive
        type: string

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: "22"
  DEPLOY_HOST: 137.184.102.22
  DEPLOY_USER: mserp-deploy

jobs:
  build:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || (inputs.local_release_sha == '' && inputs.local_release_checksum == '')
    concurrency:
      group: mserp-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mserp_assignment_history_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Prepare isolated assignment history database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d mserp_assignment_history_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE mserp_app; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public'

      - name: Check deployment compatibility guards
        run: bash deploy/release-checks.sh guards

      - name: Test backend
        env:
          MSERP_RELEASE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mserp_assignment_history_test?sslmode=disable
        run: bash deploy/release-checks.sh backend

      - name: Build Linux backend binaries
        run: bash deploy/release-checks.sh build-backend

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build static frontend
        run: bash deploy/release-checks.sh frontend

      # Full browser regressions are opt-in for manual runs; regular pushes keep
      # database/migration tests, lint, calculation checks and production builds.
      # The hosted Ubuntu 24.04 image already supplies Chromium's shared libraries.
      # Avoid --with-deps: its redundant apt upgrades can stall on package mirrors.
      - name: Install Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Verify administrator dashboard in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-dashboard-views.mjs

      - name: Verify payroll browser timing instrumentation
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-payroll-timing.mjs

      - name: Verify completed payroll week rollover
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-payroll-completed-week.mjs

      - name: Verify prepared payroll drafts and command recovery
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-payroll-prepared.mjs

      - name: Verify concurrent statement finalizations
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-payroll-concurrent-finalization.mjs

      - name: Verify pinnable headers and Gross Board load search in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-pinnable-headers.mjs

      - name: Verify payroll extra loads in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        env:
          MSERP_INVESTOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mserp_assignment_history_test?sslmode=disable
        run: node scripts/test-investors-e2e.mjs --load-placements-only

      - name: Verify Gross Board daily load editing in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: |
          node scripts/test-gross-board-daily-loads.mjs
          node scripts/test-gross-board-reliability.mjs

      - name: Verify dispatcher profiles in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-dispatcher-views.mjs

      - name: Verify restricted driver profiles in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-driver-profile-access.mjs

      - name: Verify fleet inventory and stored trailers in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-inventory-views.mjs

      - name: Verify investor flows in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        env:
          MSERP_INVESTOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mserp_assignment_history_test?sslmode=disable
        run: |
          node scripts/test-investors-e2e.mjs
          node scripts/test-investors-e2e.mjs --vacations-only

      - name: Verify driver teams in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        env:
          MSERP_INVESTOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mserp_assignment_history_test?sslmode=disable
        run: node scripts/test-investors-e2e.mjs --teams-only

      - name: Verify driver charges in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        env:
          MSERP_DRIVER_CHARGES_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mserp_assignment_history_test?sslmode=disable
        run: |
          node scripts/test-driver-charges-e2e.mjs
          node scripts/test-driver-charges-e2e.mjs --pay-source-only

      - name: Verify charge filters and week navigation in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-charge-views.mjs

      - name: Verify task assignments and board views in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: |
          node scripts/test-task-board-views.mjs
          node scripts/test-sidebar-task-badges.mjs

      - name: Verify PrePass management in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: node scripts/test-prepass-views.mjs

      - name: Verify expenses, load notes and layover retirement in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: |
          node scripts/test-expense-views.mjs
          node scripts/test-payroll-expenses.mjs
          node scripts/test-gross-board-notes.mjs
          node scripts/test-layover-views.mjs

      - name: Verify spreadsheet keyboard navigation in Chromium
        if: inputs.full_browser_tests == true
        working-directory: frontend
        run: |
          node scripts/test-payroll-grid.mjs
          node scripts/test-board-grid.mjs

      - name: Package release
        run: bash deploy/release-checks.sh package

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mserp-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (needs.build.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
    needs: build
    concurrency:
      group: mserp-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate deployment inputs
        if: needs.build.result == 'skipped'
        env:
          LOCAL_SHA: ${{ inputs.local_release_sha }}
          LOCAL_CHECKSUM: ${{ inputs.local_release_checksum }}
          FULL_BROWSER_TESTS: ${{ inputs.full_browser_tests }}
        run: |
          set -euo pipefail
          if [[ $LOCAL_SHA != "$GITHUB_SHA" || ! $LOCAL_CHECKSUM =~ ^[0-9a-f]{64}$ || $FULL_BROWSER_TESTS == true ]]; then
            echo 'Provide the exact main commit and its local archive checksum, with full_browser_tests disabled.' >&2
            exit 1
          fi

      - name: Download release artifact
        if: needs.build.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mserp-${{ github.sha }}
          path: artifact

      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MSERP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MSERP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/mserp_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/mserp_deploy ~/.ssh/known_hosts

      - name: Activate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_CHECKSUM: ${{ inputs.local_release_checksum }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i ~/.ssh/mserp_deploy
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming=/var/lib/mserp-deploy/incoming
          archive="$incoming/$GITHUB_SHA.tar.gz"
          if [[ -n $LOCAL_CHECKSUM ]]; then
            checksum=$LOCAL_CHECKSUM
            staged="$incoming/$GITHUB_SHA.$checksum.local.tar.gz"
            prepare="mv -T -- '$staged' '$archive' && "
          else
            checksum=$(cut -d ' ' -f 1 "artifact/mserp-${GITHUB_SHA}.sha256")
            [[ $checksum =~ ^[0-9a-f]{64}$ ]]
            scp "${ssh_options[@]}" "artifact/mserp-$GITHUB_SHA.tar.gz" "$target:$archive"
            prepare=
          fi
          # The production job is serialized. Recheck main immediately before activation
          # so an older run cannot overwrite a newer deployment.
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ $main_sha != "$GITHUB_SHA" ]]; then
            echo "Refusing to activate $GITHUB_SHA because main is now $main_sha." >&2
            exit 1
          fi
          ssh "${ssh_options[@]}" "$target" \
            "${prepare}sudo /usr/local/sbin/mserp-deploy '$GITHUB_SHA' '$checksum'"
