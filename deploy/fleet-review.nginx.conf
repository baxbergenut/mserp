# Install after the conflicts.msexpressinc.net certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name conflicts.msexpressinc.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name conflicts.msexpressinc.net;
    ssl_certificate /etc/letsencrypt/live/conflicts.msexpressinc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conflicts.msexpressinc.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/fleet-review-access.log;
    error_log /var/log/nginx/fleet-review-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
    }
}
